<!DOCTYPE html>
<html lang="{{ site.lang }}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} |
        {% endif %}
        {{ site.title }}
    </title>

    <meta name="description"
          content="{{ page.description | default: site.description | escape }}">

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

</head>


<body>

    <!-- Header -->

    <header class="site-header">

        <div class="container header-inner">

            <a class="site-title"
               href="{{ '/' | relative_url }}">

                {{ site.title }}

            </a>


            <nav class="site-nav">

                <a href="{{ '/' | relative_url }}">
                    Home
                </a>

                <a href="{{ site.github_url }}">
                    GitHub
                </a>

            </nav>

        </div>

    </header>


    <!-- Main Content -->

    <main class="container">

        {{ content }}

    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © {{ 'now' | date: "%Y" }}
                {{ site.author }}
                · Powered by Jekyll
            </p>

        </div>

    </footer>


</body>

</html>
